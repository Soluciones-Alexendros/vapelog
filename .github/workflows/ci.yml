name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate .env.example coverage
        run: pnpm run check:env

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests + coverage gate (≥70%)
        run: |
          set -euo pipefail
          OUT="$(mktemp)"
          pnpm run test:coverage 2>&1 | tee "$OUT"
          LINE="$(grep -Eo 'all files[[:space:]]+\|[[:space:]]+[0-9.]+' "$OUT" | head -1 | grep -Eo '[0-9.]+$')"
          if [ -z "$LINE" ]; then
            echo "No se pudo leer la cobertura total" >&2
            exit 1
          fi
          echo "Cobertura de líneas: ${LINE}%"
          awk -v c="$LINE" 'BEGIN { exit (c+0 < 70) ? 1 : 0 }'

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Pack build output
        run: tar -czf app-build.tgz .output

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-build
          path: app-build.tgz
          if-no-files-found: error
          retention-days: 3

  smoke:
    name: smoke
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: app-build

      - name: Unpack build output
        run: tar -xzf app-build.tgz

      - name: Smoke
        run: pnpm run smoke

  browser:
    name: browser
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: app-build

      - name: Unpack build output
        run: tar -xzf app-build.tgz

      - name: Install Chromium for browser checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility pass + browser smoke
        run: |
          set -euo pipefail
          HOST=127.0.0.1 NITRO_HOST=127.0.0.1 NITRO_PORT=4173 PORT=4173 \
            node .output/server/index.mjs >nitro-browser.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "El servidor Nitro murió al arrancar" >&2
              cat nitro-browser.log >&2 || true
              exit 1
            fi
            if curl -fsS -o /dev/null "http://127.0.0.1:4173/" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != "1" ]; then
            echo "Timeout esperando a http://127.0.0.1:4173/" >&2
            cat nitro-browser.log >&2 || true
            exit 1
          fi
          A11Y_URL=http://127.0.0.1:4173/ node scripts/a11y-pass.mjs
          node scripts/browser-smoke.mjs http://127.0.0.1:4173/ artifacts/desktop.png

  release:
    name: release
    needs: [smoke, browser]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Version, tag y GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs
