name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate .env.example coverage
        run: pnpm run check:env

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests + coverage gate (≥70%)
        run: |
          set -euo pipefail
          OUT="$(mktemp)"
          pnpm run test:coverage 2>&1 | tee "$OUT"
          LINE="$(grep -Eo 'all files[[:space:]]+\|[[:space:]]+[0-9.]+' "$OUT" | head -1 | grep -Eo '[0-9.]+$')"
          if [ -z "$LINE" ]; then
            echo "No se pudo leer la cobertura total" >&2
            exit 1
          fi
          echo "Cobertura de líneas: ${LINE}%"
          awk -v c="$LINE" 'BEGIN { exit (c+0 < 70) ? 1 : 0 }'

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Check build manifest
        run: pnpm run check:manifest

      - name: Pack build output
        run: tar -czf app-build.tgz .output

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-build
          path: app-build.tgz
          if-no-files-found: error
          retention-days: 3

  smoke:
    name: smoke
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: app-build

      - name: Unpack build output
        run: tar -xzf app-build.tgz

      - name: Smoke
        run: pnpm run smoke

  browser:
    name: browser
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: app-build

      - name: Unpack build output
        run: tar -xzf app-build.tgz

      - name: Install Chromium for browser checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility pass + browser smoke
        run: |
          set -euo pipefail
          HOST=127.0.0.1 NITRO_HOST=127.0.0.1 NITRO_PORT=4173 PORT=4173 \
            node .output/server/index.mjs >nitro-browser.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "El servidor Nitro murió al arrancar" >&2
              cat nitro-browser.log >&2 || true
              exit 1
            fi
            if curl -fsS -o /dev/null "http://127.0.0.1:4173/" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != "1" ]; then
            echo "Timeout esperando a http://127.0.0.1:4173/" >&2
            cat nitro-browser.log >&2 || true
            exit 1
          fi
          A11Y_URL=http://127.0.0.1:4173/ node scripts/a11y-pass.mjs
          node scripts/browser-smoke.mjs http://127.0.0.1:4173/ artifacts/desktop.png

  fx-e2e:
    name: fx-e2e
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: app-build

      - name: Unpack build output
        run: tar -xzf app-build.tgz

      - name: Install Chromium for fx e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright fx suite
        run: |
          set -euo pipefail
          PORT=4175
          export HOST=127.0.0.1
          export NITRO_HOST=127.0.0.1
          export NITRO_PORT="${PORT}"
          export PORT
          node .output/server/index.mjs >nitro-fx-e2e.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "El servidor Nitro murió al arrancar" >&2
              cat nitro-fx-e2e.log >&2 || true
              exit 1
            fi
            if curl -fsS -o /dev/null "http://127.0.0.1:${PORT}/" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != "1" ]; then
            echo "Timeout esperando a http://127.0.0.1:${PORT}/" >&2
            cat nitro-fx-e2e.log >&2 || true
            exit 1
          fi
          E2E_BASE_URL="http://127.0.0.1:${PORT}" E2E_PORT="${PORT}" pnpm exec playwright test

  smoke-bench:
    name: smoke-bench (informativo)
    needs: [build]
    # Informativo: mide el coste propio del humo y avisa si supera el umbral,
    # pero no bloquea el pipeline (S7 §7).
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: app-build

      - name: Unpack build output
        run: tar -xzf app-build.tgz

      - name: Install Chromium for bench
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke bench (umbral de aviso, no bloqueante)
        run: |
          set -uo pipefail
          node scripts/smoke-bench.mjs --seconds 8 --theme light --cpu 1 > bench.jsonl
          node scripts/smoke-bench.mjs --seconds 8 --theme dark  --cpu 1 >> bench.jsonl
          node scripts/smoke-bench.mjs --seconds 8 --theme light --cpu 4 >> bench.jsonl
          cat bench.jsonl
          node --input-type=module -e '
            import fs from "node:fs";
            const rows = fs.readFileSync("bench.jsonl", "utf8").split("\n")
              .filter((l) => l.trim().startsWith("{"))
              .map((l) => JSON.parse(l))
              .filter((r) => r.smokeMeanMs != null);
            const over = [];
            for (const r of rows) {
              const meanMax = r.cpu > 1 ? 4 : 2;
              if (r.smokeMeanMs > meanMax || r.smokeP95Ms > 4) {
                over.push(r.theme + "/cpu" + r.cpu + ": mean=" + r.smokeMeanMs + "ms p95=" + r.smokeP95Ms + "ms");
              }
            }
            if (over.length) {
              console.log("::warning title=Umbral de humo superado::" + over.join("; "));
            } else {
              console.log("Humo dentro de umbrales (≤2 ms/frame desktop, ≤4 ms con CPU ×4).");
            }
          '

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit producción (alto/crítico)
        run: pnpm audit --prod --audit-level=high

      - name: Contraste GHSA-qx66 vs lockfile
        run: pnpm run check:supply-chain

      - name: Lint workflows (actionlint por SHA)
        uses: reviewdog/action-actionlint@086cc5300a077f608b81d2b03801bc382e417264 # v1.65.2
        with:
          fail_level: error
          reporter: github-check
          filter_mode: nofilter

      - name: Escáner de secretos (trufflehog por SHA)
        uses: trufflesecurity/trufflehog@90190deac64289cb10bb694894be8db9ead8790b # v3.88.29
        with:
          extra_args: --results=verified,unknown --exclude-paths=.trufflehogignore

  sql-integration:
    name: sql-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vapelog
          POSTGRES_PASSWORD: vapelog
          POSTGRES_DB: vapelog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vapelog -d vapelog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vapelog:vapelog@localhost:5432/vapelog
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply schema with ON_ERROR_STOP
        env:
          SQL_INTEGRATION: "1"
        run: node scripts/sql-install.mjs

      - name: Reject uniqueness / FK fixtures
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "insert into platform (slug, name) values ('fixture-plat', 'Fixture');"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "insert into platform (slug, name) values ('fixture-plat', 'Dup');" \
            2>/tmp/uniq-err.txt; then
            echo "Se esperaba fallo de unicidad en platform.slug" >&2
            exit 1
          fi
          grep -qi 'unique\|duplicate\|violates' /tmp/uniq-err.txt
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "insert into device_platform (device_id, platform_id, role)
             values ('00000000-0000-4000-8000-000000000001',
                     (select id from platform where slug = 'fixture-plat'),
                     'nativa');" \
            2>/tmp/fk-err.txt; then
            echo "Se esperaba fallo FK device_platform" >&2
            exit 1
          fi
          grep -qi 'foreign key\|violates' /tmp/fk-err.txt

  release-ready:
    name: release-ready
    if: always()
    needs: [quality, test, build, smoke, browser, fx-e2e, supply-chain, sql-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Evaluar gate de publicación
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > /tmp/needs.json
          node scripts/release-ready.mjs /tmp/needs.json

  release:
    name: release
    needs: [release-ready]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Version, tag y GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs
